<style>

#q{flex:1;border:none;outline:none;font-size:15px;background:transparent;color:var(--txt);padding:8px 0}

#btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}

.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 2px;scrollbar-width:none}

.chip{flex-shrink:0;background:var(--card);border:1px solid var(--line);color:var(--blue);border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap}

.topic-nav{display:flex;gap:8px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}

.tp.on{background:var(--blue);color:#fff;border-color:var(--blue)}

.vt{flex:1;text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;font-size:13.5px;cursor:pointer;color:var(--txt2);font-weight:500;-webkit-appearance:none;appearance:none;font-family:inherit}

.vt .vt-s{display:block;font-size:11px;font-weight:400;opacity:.75;margin-top:1px}

.ins-abs{font-size:13px;color:var(--txt);margin:6px 0 8px}

.persp{display:flex;flex-direction:column;gap:6px;margin:6px 0 2px}
.persp-line{display:flex;gap:7px;align-items:flex-start;border-radius:9px;padding:7px 10px;font-size:12.8px}

/* ===== 策略要点 ===== */

.rep-action .a-title::before{content:"";width:4px;height:14px;background:#7FE0C0;border-radius:2px;display:inline-block}

/* ===== 证据列表视图（保留） ===== */
.strategy{background:var(--teal-l);border-left:3px solid var(--teal);border-radius:0 10px 10px 0;padding:10px 12px;font-size:13.5px;margin:8px 0 12px}
.strategy b{color:var(--teal)}
.evidence-list{display:flex;flex-direction:column;gap:10px}
.ev{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}

.ev-title{font-size:13.5px;font-weight:500;color:var(--txt)}
.ev-conc{font-size:13px;color:var(--txt);margin:4px 0}

.ev-meta{font-size:12px;color:var(--txt2);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.ev-meta a{color:var(--blue);text-decoration:none;word-break:break-all}
.none{text-align:center;padding:30px 16px;color:var(--txt2);font-size:13.5px}
.none .big{font-size:30px;margin-bottom:8px}
footer{color:var(--txt2);font-size:11.5px;text-align:center;padding:22px 16px 0;line-height:1.8}

  h1{font-size:17px}

  .ov-grid{grid-template-columns:repeat(2,1fr)}

}

<header>
  <div class="wrap">
    <div class="logo">全国肝病联盟与2030慢性肝病行动</div>

      <div class="stat"><b id="sTotal">0</b>篇收录</div>

</header>

<div class="wrap">
  <div class="search">
    <div class="box">
      <input id="q" type="search" placeholder="输入你的问题，如：初治患者如何选药？" autocomplete="off">

    <button type="button" class="vt on" data-v="report" onclick="switchKbView('report')">📋 洞察报告<span class="vt-s">概览 · 分章 · 策略要点</span></button>
    <button type="button" class="vt" data-v="cards" onclick="switchKbView('cards')">🗂 证据列表<span class="vt-s">逐条原始证据 · 可追溯</span></button>
  </div>

  <div id="result">

      输入问题或点击上方示例提问。<br>回答以「洞察报告」形式输出：先概览、再分章洞察、最后策略要点。
    </div>
  </div>

  <footer>
    本应用数据来源于公开文献与官方文件题录，仅供学习参考，不构成临床诊疗建议。<br>
    库内证据按「证据等级 A-D × 关注优先级 P0-P3」双维分级，具体诊疗请遵医嘱。
  </footer>
</div>

<script id="kb-data" type="application/json">__KB_DATA__</script>
<script>
(function(){
"use strict";

var KB = JSON.parse(document.getElementById("kb-data").textContent);
var CARDS = KB.cards || [];

var TOPICS = {
  "T1": "指南政策", "T2": "筛查检测", "T3": "治疗策略", "T4": "治疗方案",
  "T5": "肝癌早筛", "T6": "长期管理", "T7": "联盟建设"
};

var TOPIC_KEYWORDS = [
  {t:"T7", kw:["联盟","门诊","规范化","医防融合","巡讲","培训","建设","医院管理","专项"]},
  {t:"T5", kw:["肝癌","hcc","肝细胞癌","列线图","风险预测","afp","超声","早筛","筛查和监测","复发"]},
  {t:"T2", kw:["筛查","检测","诊断","hbsag检测","高危人群","主动筛查","表面抗原","普遍筛查"]},
  {t:"T3", kw:["治疗时机","启动治疗","alt","适应证","扩大治疗","阈值","治疗策略","治疗指征","正常alt"]},
  {t:"T4", kw:["初治","经治","干扰素","恩替卡韦","替诺福韦","taf","tdf","etv","临床治愈","新药","联合","序贯","hbsag清除","血清学转换","病毒学应答","停药后","低病毒","核苷"]},
  {t:"T6", kw:["随访","依从性","停药","复发","pgRNA","长期管理","监测","管理","生存"]},
  {t:"T1", kw:["指南","政策","战略","2030","消除","行动","防治","健康中国","世卫","who","路线图"]}
];

var EXAMPLES = [
  "初治患者怎么选药？",
  "哪些人需要筛查乙肝？",
  "临床治愈有多大可能？",
  "肝癌风险怎么预测？",
  "停药时机如何判断？",
  "干扰素联合治疗怎么用？"
];

var KEY_FIELDS = ["中文标题","核心结论","治疗方案","适用患者分层","对中国实践的启示","对2030行动的意义","研究人群","主要终点","临床价值"];

function F(c, key){
  for(var k in c){ if(k.indexOf(key) >= 0) return c[k] || ""; }
  return "";
}
function clean(s){ return String(s||"").trim(); }

function rankGrade(g){ var r={"A":0,"B":1,"C":2,"D":3}[g]; return r===undefined?4:r; }
function rankPrio(p){ var r={"P0":0,"P1":1,"P2":2,"P3":3}[p]; return r===undefined?4:r; }

function findTopic(q){
  var ql = q.toLowerCase();
  for(var i=0;i<TOPIC_KEYWORDS.length;i++){
    var g = TOPIC_KEYWORDS[i];
    for(var j=0;j<g.kw.length;j++){
      if(ql.indexOf(g.kw[j].toLowerCase()) >= 0) return g.t;
    }
  }
  return null;
}

function search(q){
  var ql = q.toLowerCase();
  var topic = findTopic(q);
  var hits = [];
  CARDS.forEach(function(c){
    var hay = [];
    KEY_FIELDS.forEach(function(f){ var v=F(c,f); if(v) hay.push(v); });
    var hayTxt = hay.join(" ").toLowerCase();
    var score = 0;
    var qParts = q.replace(/[？?。，,、\s]+/g," ").split(" ").filter(function(s){return s.length>1;});
    if(qParts.length===0) qParts=[q];
    qParts.forEach(function(p){
      p=p.toLowerCase();
      if(hayTxt.indexOf(p)>=0){ score += p.length>=4 ? 3 : 2; }
    });
    if(topic && F(c,"所属一级专题")===topic) score += 4;
    if(topic && (hayTxt.indexOf(topic.toLowerCase())>=0)) score += 1;
    if(score>0) hits.push({c:c, score:score});
  });
  hits.sort(function(a,b){
    if(b.score!==a.score) return b.score-a.score;
    var gd = rankGrade(F(b.c,"证据等级"))-rankGrade(F(a.c,"证据等级"));
    if(gd!==0) return gd;
    return rankPrio(F(b.c,"建议关注优先级"))-rankPrio(F(a.c,"建议关注优先级"));
  });
  return {hits:hits, topic:topic};
}

function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function badgeCls(level){
  if(level==="A")return"b-A"; if(level==="B")return"b-B";
  if(level==="C")return"b-C"; return"b-D";
}
function prioCls(p){
  if(p==="P0")return"b-P0"; if(p==="P1")return"b-P1";
  if(p==="P2")return"b-P2"; return"b-P3";
}

/* 取文本第一句（按中文句读断句） */
function firstSent(t, maxLen){
  var s = String(t||"").trim();
  if(!s) return "";
  var parts = s.split(/[。；;！？!?]/);
  var first = (parts[0]||"").trim();
  if(!first) first = s.slice(0, 40);
  if(first.length > (maxLen||60)) first = first.slice(0, (maxLen||60)) + "…";
  return first;
}
function isChina(c){
  var v = clean(F(c,"是否中国研究"));
  return v && v!=="否" && v!=="未报告" && v!=="国际" && v!=="国外";
}

/* ============ 洞察报告渲染 ============ */

function buildFindings(hits){
  var f = [];
  hits.slice(0,3).forEach(function(h){
    var c = h.c;
    var title = clean(F(c,"中文标题"));
    var t = clean(F(c,"核心结论"));
    if(!t) return;
    var first = firstSent(t, 68);
    if(first) f.push({t:title, s:first});
  });
  return f;
}

function buildActions(hits){
  var acts = [];
  var seen = {};
  hits.forEach(function(h){
    if(acts.length>=3) return;
    var c = h.c;
    var t = clean(F(c,"对中国实践的启示")) || clean(F(c,"对2030行动的意义")) || clean(F(c,"核心结论"));
    if(!t) return;
    var first = firstSent(t, 58);
    if(!first || seen[first]) return;
    seen[first] = 1;
    acts.push({s:first, t:clean(F(c,"中文标题"))});
  });
  return acts;
}

function metaLine(c){
  var m = [];
  var author = clean(F(c,"第一作者"));
  var journal = clean(F(c,"期刊或发布机构"));
  var year = clean(F(c,"发布年份"));
  if(author) m.push('作者：'+esc(author));
  if(journal) m.push(esc(journal));
  if(year) m.push(esc(year));
  var pmid = clean(F(c,"PMID"));
  var doi = clean(F(c,"DOI"));
  var link = clean(F(c,"原文链接"));
  if(pmid && pmid!=="未报告") m.push('PMID：'+esc(pmid));
  if(doi && doi!=="未报告") m.push('DOI：'+esc(doi));
  if(link && link!=="未报告") m.push('<a href="'+esc(link)+'" target="_blank" rel="noopener">原文链接 ↗</a>');
  return m.join('　');
}

function insightHTML(c){
  var g = clean(F(c,"证据等级"))||"D";
  var p = clean(F(c,"建议关注优先级"))||"P3";
  var title = clean(F(c,"中文标题")) || "未命名";
  var conc = clean(F(c,"核心结论"));
  var clin = clean(F(c,"对中国实践的启示"));
  var act  = clean(F(c,"对2030行动的意义"));
  var value= clean(F(c,"临床价值"));
  var htm = '<div class="insight">';
  htm += '<div class="ins-top">';
  htm += '<span class="badge '+badgeCls(g)+'">证据'+g+'</span>';
  htm += '<span class="badge '+prioCls(p)+'">'+p+'</span>';
  if(isChina(c)) htm += '<span class="badge b-CN">中国证据</span>';
  htm += '<span class="ins-title">'+esc(title)+'</span></div>';
  if(conc){ htm += '<div class="ins-abs">'+esc(conc)+'</div>'; }
  var persp = '';
  if(clin){ persp += '<div class="persp-line persp-clin"><span class="ic">💊</span><span class="lab">临床启示</span><span class="tx">'+esc(clin)+'</span></div>'; }
  var mkt = act || value;
  if(mkt){ persp += '<div class="persp-line persp-mkt"><span class="ic">📈</span><span class="lab">市场/行动启示</span><span class="tx">'+esc(mkt)+'</span></div>'; }
  if(persp){ htm += '<div class="persp">'+persp+'</div>'; }
  var ml = metaLine(c);
  if(ml){ htm += '<div class="ins-meta">'+ml+'</div>'; }
  htm += '</div>';
  return htm;
}

function renderReport(q, res){
  var hits = res.hits;
  var el = document.getElementById("result");
  var htm = '';
  /* —— 报告头 —— */
  var topicSet = {};
  var chinaN = 0, abN = 0;
  hits.forEach(function(h){
    var c = h.c;
    topicSet[F(c,"所属一级专题")]=1;
    if(isChina(c)) chinaN++;
    var g = clean(F(c,"证据等级"));
    if(g==="A"||g==="B") abN++;
  });
  var topicTags = '';
  var tKeys = [];
  for(var t in topicSet){ if(TOPICS[t]) tKeys.push(t); }
  tKeys.sort();
  tKeys.forEach(function(t){ topicTags += '<span class="rtag">'+TOPICS[t]+'</span>'; });
  htm += '<div class="rep-head">';
  htm += '<div class="rh-logo">全国肝病联盟与2030慢性肝病行动 · 专题知识库</div>';
  htm += '<h3>关于「'+esc(q)+'」的证据洞察报告</h3>';
  htm += '<div class="rh-sub">基于库内 '+hits.length+' 篇强相关文献的结构化总结与双视角启示</div>';
  if(topicTags){ htm += '<div class="rep-tags">'+topicTags+'</div>'; }
  htm += '<div class="rh-src">数据来源：专题知识库主表 · 生成日期 '+esc(KB.meta.updated||"")+' · 证据分级 A-D × 优先级 P0-P3</div>';
  htm += '</div>';
  /* —— 报告概览 —— */
  htm += '<div class="rep-ov">';
  htm += '<div class="ov-title">报告概览 · 证据全景</div>';
  htm += '<div class="ov-grid">';
  htm += '<div class="ov-cell"><div class="n">'+hits.length+'</div><div class="l">命中文献</div></div>';
  htm += '<div class="ov-cell"><div class="n">'+chinaN+'</div><div class="l">中国证据</div></div>';
  htm += '<div class="ov-cell"><div class="n">'+abN+'</div><div class="l">A+B级证据</div></div>';
  htm += '<div class="ov-cell"><div class="n">'+tKeys.length+'</div><div class="l">覆盖专题</div></div>';
  htm += '</div>';
  /* 核心发现 */
  var finds = buildFindings(hits);
  if(finds.length){
    htm += '<div class="finding"><div class="f-t">核心发现（按证据等级与优先级提取）</div>';
    finds.forEach(function(fi, i){
      htm += '<div class="f-it"><b>发现'+(i+1)+'：</b>'+esc(fi.s)+'</div>';
      htm += '<div class="f-src">来源：'+esc(fi.t)+'</div>';
    });
    htm += '</div>';
  }
  htm += '</div>';
  /* —— 分章洞察 —— */
  var chapIdx = 0;
  tKeys.forEach(function(t){
    var sub = hits.filter(function(h){ return F(h.c,"所属一级专题")===t; });
    if(!sub.length) return;
    chapIdx++;
    var cn = sub.filter(function(h){ return isChina(h.c); }).length;
    htm += '<div class="chap">';
    htm += '<div class="chap-head"><span class="chap-no">第'+('一二三四五六七'.charAt(chapIdx-1)||chapIdx)+'章</span>';
    htm += '<span class="chap-title">'+TOPICS[t]+'</span>';
    htm += '<span class="chap-cnt">'+sub.length+'篇 · 中国'+cn+'篇</span></div>';
    /* 章节导语 */
    var leadSrc = '';
    for(var i=0;i<sub.length;i++){
      var lc = sub[i].c;
      leadSrc = clean(F(lc,"对中国实践的启示")) || clean(F(lc,"核心结论"));
      if(leadSrc) break;
    }
    if(leadSrc){
      htm += '<div class="chap-lead">本章聚焦「<b>'+TOPICS[t]+'</b>」方向，共 '+sub.length+' 篇证据。核心线索：'+esc(firstSent(leadSrc, 70))+'</div>';
    }
    sub.forEach(function(h){ htm += insightHTML(h.c); });
    htm += '</div>';
  });
  /* —— 策略要点 —— */
  var acts = buildActions(hits);
  if(acts.length){
    htm += '<div class="rep-action"><div class="a-title">策略要点 · 可行动建议</div>';
    acts.forEach(function(a, i){
      htm += '<div class="a-item"><span class="no">'+(i+1)+'</span><span class="tx"><b>'+esc(a.t)+'：</b>'+esc(a.s)+'</span></div>';
    });
    htm += '<div class="a-src">要点提取自库内最高等级证据的「对中国实践的启示 / 对2030行动的意义」，可点击证据卡片溯源原文。</div>';
    htm += '</div>';
  }
  htm += '<div class="hint" style="text-align:center">以上洞察基于库内结构化字段自动拼装生成 · 命中 '+hits.length+' 条证据 · 可切换到「证据列表」逐条核对</div>';

  el.innerHTML = '<div class="qa"><div class="qline"><div class="avatar">问</div><div class="txt">'+esc(q)+'</div></div><div class="aline"><div class="avatar">答</div><div class="body">'+htm+'</div></div></div>';
}

/* ============ 证据列表视图（保留） ============ */

function buildStrategy(hits){
  var top = hits.slice(0,3).filter(function(h){ return rankGrade(F(h.c,"证据等级"))<=1; });
  if(top.length===0) top = hits.slice(0,2);
  if(top.length===0) return "";
  var lines = [];
  top.forEach(function(h){
    var c=h.c;
    var impl = clean(F(c,"对中国实践的启示"));
    var p2030 = clean(F(c,"对2030行动的意义"));
    var s = "「"+clean(F(c,"中文标题"))+"」（证据"+clean(F(c,"证据等级"))+"）";
    if(impl && impl!=="未报告") s += "："+impl;
    else if(p2030 && p2030!=="未报告") s += "："+p2030;
    else if(clean(F(c,"核心结论"))) s += "："+clean(F(c,"核心结论"));
    lines.push(s);
  });
  return lines.join("<br>");
}

function cardHTML(c){
  var g = clean(F(c,"证据等级"))||"D";
  var p = clean(F(c,"建议关注优先级"))||"P3";
  var title = clean(F(c,"中文标题")) || "未命名";
  var conc = clean(F(c,"核心结论"));
  var meta = [];
  var journal = clean(F(c,"期刊或发布机构"));
  var year = clean(F(c,"发布年份"));
  var author = clean(F(c,"第一作者"));
  var t4 = clean(F(c,"所属一级专题"));
  var htm = '<div class="ev">';
  htm += '<div class="ev-top"><span class="badge '+badgeCls(g)+'">证据'+g+'</span>';
  htm += '<span class="badge '+prioCls(p)+'">'+p+'</span>';
  if(isChina(c)) htm += '<span class="badge b-CN">中国证据</span>';
  htm += '<span class="badge b-P3">'+(t4?esc(t4):"")+'</span>';
  htm += '<span class="ev-title">'+esc(title)+'</span></div>';
  if(conc){ htm += '<div class="ev-conc">'+esc(conc)+'</div>'; }
  htm += '<div class="ev-meta">';
  if(author) htm += '<span>作者：'+esc(author)+'</span>';
  if(journal) htm += '<span>'+esc(journal)+'</span>';
  if(year) htm += '<span>'+esc(year)+'</span>';
  var pmid = clean(F(c,"PMID"));
  var doi = clean(F(c,"DOI"));
  var link = clean(F(c,"原文链接"));
  if(pmid && pmid!=="未报告") htm += '<span>PMID：'+esc(pmid)+'</span>';
  if(doi && doi!=="未报告") htm += '<span>DOI：'+esc(doi)+'</span>';
  if(link && link!=="未报告") htm += '<span><a href="'+esc(link)+'" target="_blank" rel="noopener">原文链接 ↗</a></span>';
  htm += '</div></div>';
  return htm;
}

function renderCards(q, res){
  var topic = res.topic;
  var hits = res.hits;
  var el = document.getElementById("result");
  var htm = '<div class="qa">';
  htm += '<div class="qline"><div class="avatar">问</div><div class="txt">'+esc(q)+'</div></div>';
  htm += '<div class="aline"><div class="avatar">答</div><div class="body">';
  if(hits.length===0){
    htm += '<div class="ans-title">未检索到直接匹配的证据</div>';
    htm += '<div class="ev-conc">当前库内尚未收录与"'+esc(q)+'"直接相关的文献。建议：</div>';
    if(topic && TOPICS[topic]){
      htm += '<div class="ev-conc">① 尝试浏览「'+TOPICS[topic]+'」专题下的全部证据；</div>';
    }else{
      htm += '<div class="ev-conc">① 换个关键词再试（如"筛查""干扰素""停药"）；</div>';
    }
    htm += '<div class="ev-conc">② 该主题可能属于待收录方向，可告知我们增补。</div>';
    htm += '<div class="hint">提示：知识库持续更新中，当前收录 '+CARDS.length+' 篇。</div>';
  }else{
    var total = hits.length;
    htm += '<div class="ans-title">共命中 '+total+' 条证据'+(topic&&TOPICS[topic]?'（聚焦专题：'+TOPICS[topic]+'）':'')+'</div>';
    var strat = buildStrategy(hits);
    if(strat){
      htm += '<div class="strategy"><b>策略建议（基于最高等级证据）：</b><br>'+strat+'</div>';
    }
    htm += '<div class="evidence-list">';
    hits.slice(0,8).forEach(function(h){ htm += cardHTML(h.c); });
    if(hits.length>8) htm += '<div class="hint">… 还有 '+ (hits.length-8) +' 条相关证据，可缩小关键词查看</div>';
    htm += '</div>';
  }
  htm += '</div></div></div>';
  el.innerHTML = htm;
}

/* ============ 空结果 / 入口 ============ */

var CURRENT = {q:"", res:null, view:"report"};
window.switchKbView = function(view){
  CURRENT.view = view;
  renderByView();
};

function ask(){
  var q = document.getElementById("q").value.trim();
  if(!q){ document.getElementById("q").focus(); return; }
  CURRENT.q = q;
  CURRENT.res = search(q);
  CURRENT.view = "report";
  renderByView();
  document.getElementById("result").scrollIntoView({behavior:"smooth", block:"start"});
}

function renderByView(){
  var vt = document.getElementById("viewToggle");
  var view = CURRENT.view;
  vt.style.display = "flex";
  Array.prototype.forEach.call(vt.querySelectorAll(".vt"), function(x){
    x.classList.toggle("on", x.getAttribute("data-v")===view);
  });
  if(CURRENT.res.hits.length===0){
    renderCards(CURRENT.q, CURRENT.res);
  }else if(view==="cards"){
    renderCards(CURRENT.q, CURRENT.res);
  }else{
    renderReport(CURRENT.q, CURRENT.res);
  }
}

function renderTopicNav(){
  var nav = document.getElementById("topicNav");
  var htm = '';
  for(var t in TOPICS){
    var n = CARDS.filter(function(c){ return F(c,"所属一级专题")===t; }).length;
    htm += '<div class="tp" data-t="'+t+'">'+t+' '+TOPICS[t]+' <span style="opacity:.65">('+n+')</span></div>';
  }
  nav.innerHTML = htm;
  Array.prototype.forEach.call(nav.querySelectorAll(".tp"), function(el){
    el.addEventListener("click", function(){
      var t = el.getAttribute("data-t");
      document.getElementById("q").value = TOPICS[t] + " 专题证据";
      CURRENT.q = TOPICS[t]+" 专题证据";
      CURRENT.res = {hits: CARDS.filter(function(c){return F(c,"所属一级专题")===t;}).map(function(c){return {c:c,score:1};}), topic:t};
      CURRENT.view = "report";
      renderByView();
      Array.prototype.forEach.call(nav.querySelectorAll(".tp"), function(x){x.classList.remove("on");});
      el.classList.add("on");
    });
  });
}

function init(){
  var sT=0,sC=0,sAB=0;
  var topicSet={};
  CARDS.forEach(function(c){
    sT++;
    if(isChina(c)) sC++;
    var g=clean(F(c,"证据等级"));
    if(g==="A"||g==="B") sAB++;
    topicSet[F(c,"所属一级专题")]=1;
  });
  document.getElementById("sTotal").textContent=sT;
  document.getElementById("sChina").textContent=sC;
  document.getElementById("sAB").textContent=sAB;
  document.getElementById("sT7").textContent=Object.keys(topicSet).length;
  var chips=document.getElementById("chips");
  chips.innerHTML=EXAMPLES.map(function(e){return '<div class="chip">'+esc(e)+'</div>';}).join("");
  Array.prototype.forEach.call(chips.querySelectorAll(".chip"), function(el){
    el.addEventListener("click",function(){
      document.getElementById("q").value=el.textContent;
      ask();
    });
  });
  renderTopicNav();
  document.getElementById("btn").addEventListener("click",ask);
  document.getElementById("q").addEventListener("keydown",function(e){ if(e.key==="Enter") ask(); });
  Array.prototype.forEach.call(document.querySelectorAll(".vt"), function(x){
    x.addEventListener("click", function(){
      CURRENT.view = x.getAttribute("data-v");
      renderByView();
    });
  });
}
try{ init(); }
catch(e){
  var _r=document.getElementById("result");
  if(_r) _r.innerHTML='<div class="none"><div class="big">⚠️</div>页面加载出错：'+esc(e.message||String(e))+'<br>请使用最新版浏览器，或清除缓存后重试。</div>';
}
})();
